version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: mainfolio-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public_net
      - app_net
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    build: ../frontend
    container_name: mainfolio-frontend
    networks:
      - app_net
    restart: unless-stopped

  backend:
    build: ../backend
    container_name: mainfolio-backend
    environment:
      - DATABASE_URL=postgres://mainfolio_user:strongpassword@postgres:5432/mainfolio
      - PORT=8787
      - FRONTEND_URL=http://localhost:3000
    networks:
      - app_net
      - db_net
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mainfolio-postgres
    environment:
      POSTGRES_DB: mainfolio
      POSTGRES_USER: mainfolio_user
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  public_net:
    driver: bridge
  app_net:
    driver: bridge
  db_net:
    driver: bridge
